<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tulipán</title>
<link rel="stylesheet" href="tulip.css">
</head>
<body>

  <div class="sky"></div>
  <div class="ground"></div>

  <svg id="tulipSvg" viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">

    <!-- tallo -->
    <path id="stem" class="stem" d="M200,690 C200,690 195,500 200,320" />

    <!-- hoja izquierda -->
    <path id="leafLeft" class="leaf" d="M200,560 C140,555 95,505 90,440 C160,450 198,495 200,560 Z" />

    <!-- hoja derecha -->
    <path id="leafRight" class="leaf" d="M200,610 C260,600 305,545 308,478 C238,492 202,540 200,610 Z" />

    <!-- grupo de la flor: se mueve junto con la punta del tallo -->
    <g id="flowerGroup" class="flower-group">

      <!-- pétalos traseros -->
      <path class="petal petal-back" data-side="left"  d="M0,0 C-55,-15 -70,-95 -25,-150 C-8,-170 8,-170 0,-150 Z" />
      <path class="petal petal-back" data-side="right" d="M0,0 C55,-15 70,-95 25,-150 C8,-170 -8,-170 0,-150 Z" />

      <!-- pétalos laterales -->
      <path class="petal petal-mid" data-side="left"  d="M0,0 C-40,-10 -55,-100 -14,-165 C-4,-180 4,-180 0,-165 Z" />
      <path class="petal petal-mid" data-side="right" d="M0,0 C40,-10 55,-100 14,-165 C4,-180 -4,-180 0,-165 Z" />

      <!-- pétalo frontal central -->
      <path class="petal petal-front" d="M0,0 C-30,-5 -34,-110 0,-175 C34,-110 30,-5 0,0 Z" />

    </g>
  </svg>

  <div class="fallback-hint" id="replayHint">toca para volver a florecer</div>

  <script src="tulip.js"></script>
</body>
</html>
